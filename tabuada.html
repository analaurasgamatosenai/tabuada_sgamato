<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>

    <style>
        #principal {
            width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .titulo {
            text-align: center;
            color: brown;
        }

        #titulo {
            font-size: 40px;
        }

        #calcular {
            width: 90px;
            background-color: brown;
            border-radius: 5px;
            color: white;
        }

        #resultado {
            background-color: burlywood;
            border-radius: 5px;
            width: 75px;
            margin: 10px 40%;
            border: 3px solid black;
        }
    </style>
</head>

<body>
    <h1 class="titulo">TABUADA</h1>
    <div id="principal">
        <input type="number" name="txt1" id="txt1">
        <input type="button" value="calcular" id="calcular">

        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>

</body>

</html>
